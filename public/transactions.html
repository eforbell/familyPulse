<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#141310">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | Transactions</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <script src="theme.js?v=20260516c"></script>
  <script src="privacy.js?v=20260516c"></script>

  <link rel="stylesheet" href="sovereign-chassis.css?v=20260516c">
  <link rel="stylesheet" href="tokens.css?v=20260516c">
  <link rel="stylesheet" href="pulse-skin.css?v=20260516c">
</head>
<body data-nav-page="transactions">

  <!-- ─────────────────────────────────────────────────────────────
       OVERLAYS (same as dashboard — JS IDs preserved)
       ─────────────────────────────────────────────────────────── -->

  <div id="category-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="cat-overlay-title">
    <div class="overlay-box">
      <div class="modal-head">
        <div><h2 id="cat-overlay-title">Assign category</h2></div>
        <button type="button" class="modal-close" aria-label="Close" onclick="closeCategoryOverlay()">×</button>
      </div>
      <div class="modal-body">
        <div id="category-list" class="cat-list"></div>
        <label id="create-rule-row" class="create-rule-row hidden">
          <input type="checkbox" id="create-rule-check">
          <span>Always categorize <strong id="rule-merchant"></strong> as this</span>
        </label>
      </div>
    </div>
  </div>

  <div id="tx-detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="tx-detail-title">
    <div class="overlay-box wide">
      <div class="modal-head">
        <div>
          <h2 id="tx-detail-title">Transaction</h2>
          <p id="tx-detail-meta" class="modal-sub">Loading…</p>
        </div>
        <button type="button" class="modal-close" aria-label="Close" onclick="closeTransactionDetail()">×</button>
      </div>
      <div class="modal-body">
        <div id="tx-detail-feedback" class="tx-detail-feedback hidden"></div>

        <div class="modal-summary">
          <div class="modal-summary-row"><span class="k">Display name</span><span class="v" id="tx-detail-display-name">—</span></div>
          <div class="modal-summary-row"><span class="k">Amount</span><strong class="v" id="tx-detail-amount">—</strong></div>
          <div class="modal-summary-row"><span class="k">Category</span><span class="v" id="tx-detail-category">—</span></div>
          <div class="modal-summary-row"><span class="k">Raw synced text</span><span class="v mono" id="tx-detail-raw" style="font-weight:400; color: var(--muted);">—</span></div>
        </div>

        <section class="tx-detail-section">
          <h3>Display name</h3>
          <p class="tx-detail-subtle" id="tx-display-name-meta"></p>
          <input id="tx-display-name-input" class="tx-display-name-input hidden" type="text" maxlength="160" placeholder="Clean up this merchant/payee name">
          <div id="tx-display-name-suggestions" class="tx-display-name-suggestions hidden"></div>
          <div id="tx-display-name-readonly" class="tx-note-readonly hidden"></div>
          <div id="tx-display-name-empty" class="tx-detail-subtle">Using synced merchant/payee text.</div>
          <div id="tx-display-name-actions" class="form-actions hidden">
            <label id="tx-display-name-rule-row" class="tx-detail-checkbox hidden">
              <input id="tx-display-name-rule-check" type="checkbox">
              <span>Apply to future exact matches</span>
            </label>
            <div id="tx-display-name-rule-hint" class="tx-detail-subtle hidden"></div>
            <button class="btn-primary" type="button" onclick="saveTransactionDisplayName()">Save</button>
            <button class="btn-ghost"  type="button" onclick="clearTransactionDisplayName()">Clear</button>
          </div>
        </section>

        <section class="tx-detail-section">
          <h3>Note</h3>
          <p class="tx-detail-subtle" id="tx-note-meta"></p>
          <textarea id="tx-note-input" class="tx-note-input hidden" rows="5" placeholder="Add context, warranty details, invoice notes…"></textarea>
          <div id="tx-note-readonly" class="tx-note-readonly hidden"></div>
          <div id="tx-note-empty" class="tx-detail-subtle">No note yet.</div>
          <div id="tx-note-actions" class="form-actions hidden">
            <button class="btn-primary" type="button" onclick="saveTransactionNote()">Save</button>
            <button class="btn-ghost"  type="button" onclick="clearTransactionNote()">Clear</button>
          </div>
        </section>

        <section class="tx-detail-section">
          <h3>Attachments</h3>
          <p class="tx-detail-subtle">Receipts, invoices, photos</p>
          <div id="tx-attachment-upload" class="tx-attachment-upload hidden" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;">
            <input id="tx-attachment-input" type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.heic,.heif">
            <button class="btn-primary" type="button" onclick="uploadTransactionAttachments()">Upload</button>
          </div>
          <div id="tx-attachment-list" class="tx-attachment-list"></div>
        </section>
      </div>
      <div class="modal-foot">
        <button id="tx-detail-category-btn" class="btn-ghost" type="button" onclick="openCurrentCategoryEditor()">Reassign category</button>
      </div>
    </div>
  </div>


  <!-- ─────────────────────────────────────────────────────────────
       APP CONTENT
       ─────────────────────────────────────────────────────────── -->
  <div id="app">

    <header class="app-header">
      <h1 id="page-title">Transactions</h1>
    </header>

    <section id="transactions-section">

      <!-- ─── Filter ────────────────────────────────────────────
           Pattern: command-bar search → active-chip rail → "+ More"
           disclosure. The original 7-field grid lives behind the
           disclosure so the page first-paints clean. -->
      <div id="filter-bar" class="tx-filter">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
            <circle cx="9" cy="9" r="6"/>
            <path d="m14 14 4 4"/>
          </svg>
          <input id="filter-search" type="search" placeholder="Search merchants, categories, accounts…" autocomplete="off">
          <span class="kbd">⌘K</span>
        </div>
        <div id="filter-search-suggestions" class="tx-display-name-suggestions hidden"></div>

        <!-- Active-filter chip rail.
             transactions.js should render one .filter-chip.active per
             applied filter (account, category, date range, sort).
             Clicking the chip's .chip-x clears just that filter.
             The "Filters" trigger at the end toggles the disclosure. -->
        <div class="filter-rail" id="filter-chips">
          <!-- Examples for paint preview; transactions.js owns this list.
               Delete these before merge — the data binding will repopulate. -->
          <button type="button" class="filter-chip" id="filter-chip-trigger" aria-expanded="false" onclick="document.getElementById('filter-more').classList.toggle('hidden'); this.setAttribute('aria-expanded', !document.getElementById('filter-more').classList.contains('hidden'));">
            <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M3 5h14M6 10h8M9 15h2"/></svg>
            <span>Filters</span>
          </button>
        </div>

        <!-- More filters disclosure. Hidden by default. Original IDs
             preserved so transactions.js continues to bind. -->
        <div id="filter-more" class="filter-disclosure hidden">
          <div class="filter-field">
            <label for="filter-account">Account</label>
            <select id="filter-account"><option value="">All accounts</option></select>
          </div>
          <div class="filter-field">
            <label for="filter-category">Category</label>
            <select id="filter-category">
              <option value="">All categories</option>
              <option value="0">Uncategorized</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="filter-from">From</label>
            <input type="date" id="filter-from">
          </div>
          <div class="filter-field">
            <label for="filter-to">To</label>
            <input type="date" id="filter-to">
          </div>
          <div class="filter-field">
            <label for="filter-sort">Sort</label>
            <select id="filter-sort">
              <option value="date_desc">Newest first</option>
              <option value="date_asc">Oldest first</option>
              <option value="amount_desc">Largest amount</option>
              <option value="amount_asc">Smallest amount</option>
            </select>
          </div>
          <!-- Quick-range buttons + toggles compressed into one row -->
          <div class="filter-field" style="grid-column: 1 / -1;">
            <label>Quick range &amp; options</label>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center;">
              <button type="button" class="btn-ghost btn-xs" onclick="setQuickDateRange('this-month')">This month</button>
              <button type="button" class="btn-ghost btn-xs" onclick="setQuickDateRange('last-month')">Last month</button>
              <button type="button" class="btn-ghost btn-xs" onclick="setQuickDateRange('this-quarter')">This quarter</button>
              <button type="button" class="btn-ghost btn-xs" onclick="setQuickDateRange('this-year')">This year</button>
              <span style="flex: 1;"></span>
              <button id="btn-dedup" type="button" class="btn-ghost btn-xs">Remove duplicates</button>
            </div>
          </div>
          <div class="filter-field" style="grid-column: 1 / -1; display: flex; flex-direction: row; flex-wrap: wrap; gap: 16px; align-items: center; padding-top: 4px;">
            <label class="tx-detail-checkbox">
              <input type="checkbox" id="filter-transfers">
              <span>Show transfers</span>
            </label>
            <label class="tx-detail-checkbox">
              <input type="checkbox" id="filter-hidden">
              <span>Show suppressed</span>
            </label>
          </div>
        </div>
      </div>


      <!-- Bulk action bar -->
      <div id="bulk-bar" class="bulk-bar hidden">
        <span id="bulk-count">0 selected</span>
        <button class="btn-primary" onclick="bulkAssignCategory()">Assign category</button>
        <button class="btn-ghost"  onclick="clearSelection()">Clear</button>
      </div>

      <!-- Stats + list + pagination -->
      <div id="tx-stats" class="tx-stats"></div>
      <div id="tx-list"  class="tx-list"></div>

      <div id="pagination" class="pagination hidden">
        <button id="prev-btn" class="btn-ghost btn-xs" onclick="prevPage()" disabled>Previous</button>
        <span id="page-info" class="mono"></span>
        <button id="next-btn" class="btn-ghost btn-xs" onclick="nextPage()">Next</button>
      </div>
    </section>

  </div>

  <script src="nav.js?v=20260516c"></script>
  <script src="display-name-suggestions.js?v=20260516c"></script>
  <script src="transactions.js?v=20260516c"></script>


</body>
</html>
