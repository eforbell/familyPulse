<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | Accounts</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-page="accounts">

  <!-- Account rename overlay -->
  <div id="rename-overlay" class="overlay hidden">
    <div class="overlay-box">
      <h2>Rename Account</h2>
      <p>Set a custom household-friendly name. Leave blank to reset to the Plaid name.</p>
      <input id="rename-input" class="form-input" type="text" maxlength="80" placeholder="Custom account name">
      <div class="form-actions">
        <button class="btn-primary" onclick="submitRename()">Save</button>
        <button class="btn-ghost" onclick="resetRename()">Reset</button>
        <button class="btn-ghost" onclick="closeRenameOverlay()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="app">

    <!-- Header -->
    <header>
      <h1>Accounts</h1>
      <button id="who-btn" class="who-btn" title="Sign out"></button>
    </header>

    <!-- Net position hero -->
    <div id="net-position-card" class="net-position-card">
      <div class="net-label">NET POSITION</div>
      <div id="net-amount" class="net-amount loading-pulse">Loading...</div>
      <div id="balance-breakdown" class="balance-breakdown"></div>
    </div>

    <!-- Coverage banner -->
    <div id="coverage-banner" class="coverage-banner hidden"></div>

    <!-- Account grid -->
    <div id="accounts-grid" class="accounts-grid"></div>

  </div>

  <script src="nav.js"></script>
  <script src="accounts.js"></script>
</body>
</html>
