<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | Accounts</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-page="accounts">

  <div id="app">

    <!-- Header -->
    <header>
      <h1>Accounts</h1>
      <button id="who-btn" class="who-btn" title="Sign out"></button>
    </header>

    <!-- Net position hero -->
    <div id="net-position-card" class="net-position-card">
      <div class="net-label">NET POSITION</div>
      <div id="net-amount" class="net-amount loading-pulse">Loading...</div>
      <div id="balance-breakdown" class="balance-breakdown"></div>
    </div>

    <!-- Account grid -->
    <div id="accounts-grid" class="accounts-grid"></div>

  </div>

  <script src="nav.js"></script>
  <script src="accounts.js"></script>
</body>
</html>
