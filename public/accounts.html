<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#141310">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | Accounts</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="theme.js?v=20260516c"></script>
  <script src="privacy.js?v=20260516c"></script>
  <link rel="stylesheet" href="style.css?v=20260516c">
  <link rel="stylesheet" href="sovereign-chassis.css?v=20260516c">
  <link rel="stylesheet" href="tokens.css?v=20260516c">
  <link rel="stylesheet" href="pulse-skin.css?v=20260516c">
</head>
<body data-nav-page="accounts">

  <!-- Account rename overlay -->
  <div id="rename-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="rename-title">
    <div class="overlay-box">
      <div class="modal-head">
        <div>
          <h2 id="rename-title">Rename account</h2>
          <p class="modal-sub">Set a custom household-friendly name. Leave blank to reset to the Plaid name.</p>
        </div>
        <button type="button" class="modal-close" aria-label="Close" onclick="closeRenameOverlay()">×</button>
      </div>
      <div class="modal-body">
        <input id="rename-input" type="text" maxlength="80" placeholder="Custom account name">
      </div>
      <div class="modal-foot">
        <button class="btn-primary" onclick="submitRename()">Save</button>
        <button class="btn-ghost" onclick="resetRename()">Reset</button>
      </div>
    </div>
  </div>

  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <h1>Accounts</h1>
      <button id="who-btn" class="who-btn" title="Sign out" aria-label="Sign out"></button>
    </header>

    <!-- Net position hero -->
    <div id="net-position-card" class="net-position-card">
      <div class="net-label">Net Position</div>
      <div id="net-amount" class="net-amount loading-pulse">—</div>
      <div class="rule"></div>
      <div id="balance-breakdown" class="balance-breakdown-grid"></div>
    </div>

    <!-- Coverage banner -->
    <div id="coverage-banner" class="coverage-banner hidden"></div>

    <!-- Account grid -->
    <div id="accounts-grid" class="accounts-grid"></div>

  </div>

  <script src="nav.js?v=20260516c"></script>
  <script src="accounts.js?v=20260516c"></script>
</body>
</html>
