<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#141310">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | Recurring</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <script src="privacy.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="pulse-skin.css">
</head>
<body data-nav-page="recurring">
  <div id="recurring-detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="recurring-detail-title">
    <div class="overlay-box wide">
      <div class="modal-head">
        <div>
          <h2 id="recurring-detail-title">Recurring Detail</h2>
          <p id="recurring-detail-meta" class="modal-sub"></p>
        </div>
        <button type="button" class="modal-close" aria-label="Close" onclick="closeRecurringDetail()">×</button>
      </div>
      <div class="modal-body">
        <div id="recurring-detail-status-group" class="recurring-status-group hidden"></div>
        <div id="recurring-detail-feedback" class="recurring-detail-feedback hidden"></div>
        <div id="recurring-detail-history" class="detail-txn-list"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" onclick="closeRecurringDetail()">Close</button>
      </div>
    </div>
  </div>

  <div id="app">
    <header class="app-header">
      <h1>Recurring</h1>
      <div></div>
    </header>

    <div id="recurring-summary" class="budget-summary loading-pulse">
      <div class="summary-row">
        <div class="summary-item">
          <div class="summary-label">COMMITTED MONTHLY</div>
          <div id="recurring-committed" class="summary-value">--</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">RECURRING INCOME</div>
          <div id="recurring-income" class="summary-value" style="color:var(--green)">--</div>
        </div>
        <div class="summary-item">
          <div class="summary-label">ACTIVE PATTERNS</div>
          <div id="recurring-active" class="summary-value">--</div>
        </div>
      </div>
      <div id="commitment-strip" class="commitment-strip hidden"></div>
    </div>

    <section>
      <h2 class="section-heading">Upcoming 30 Days</h2>
      <div id="bill-calendar" class="recurring-section-card">
        <div class="empty-state loading-pulse">Loading calendar…</div>
      </div>
    </section>

    <section>
      <h2 class="section-heading">Recurring Income</h2>
      <div id="recurring-income-list" class="recurring-list">
        <div class="empty-state loading-pulse">Loading…</div>
      </div>
    </section>

    <section>
      <h2 class="section-heading">Recurring Expenses</h2>
      <div id="recurring-list" class="recurring-list">
        <div class="empty-state loading-pulse">Loading recurring items…</div>
      </div>
    </section>

    <section>
      <h2 class="section-heading">Paused</h2>
      <div id="recurring-stale" class="recurring-list">
        <div class="empty-state loading-pulse">Loading stale items…</div>
      </div>
    </section>
  </div>

  <script src="nav.js"></script>
  <script src="recurring.js"></script>
</body>
</html>
