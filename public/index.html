<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pulse</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-nav-page="dashboard">

  <!-- Member picker overlay -->
  <div id="member-overlay" class="overlay hidden">
    <div class="overlay-box">
      <h2>Who are you?</h2>
      <p>Pick your profile to get started.</p>
      <div id="member-list" class="member-grid"></div>
    </div>
  </div>

  <!-- Category assignment overlay -->
  <div id="category-overlay" class="overlay hidden">
    <div class="overlay-box">
      <h2 id="cat-overlay-title">Assign Category</h2>
      <div id="category-list" class="cat-list"></div>
      <label id="create-rule-row" class="create-rule-row hidden">
        <input type="checkbox" id="create-rule-check">
        <span>Always categorize <strong id="rule-merchant"></strong> as this</span>
      </label>
      <button class="btn-ghost" style="width:100%;margin-top:0.5rem" onclick="closeCategoryOverlay()">Cancel</button>
    </div>
  </div>

  <div id="app">

    <!-- Header -->
    <header>
      <h1>Dashboard</h1>
      <button id="who-btn" class="who-btn" onclick="openMemberPicker()" title="Change identity"></button>
    </header>

    <!-- Net position summary — links to accounts page -->
    <a href="accounts.html" style="text-decoration:none;color:inherit">
      <div id="net-position-card" class="net-position-card" style="cursor:pointer">
        <div class="net-label">NET POSITION</div>
        <div id="net-amount" class="net-amount loading-pulse">Loading...</div>
        <div id="balance-breakdown" class="balance-breakdown"></div>
      </div>
    </a>

    <!-- Pulse Intelligence — parents only -->
    <section id="magic-section" class="hidden">
      <h2 class="section-heading">Pulse Intelligence</h2>

      <!-- Weekly Digest -->
      <div id="magic-digest" class="magic-card hidden">
        <div class="magic-card-header" onclick="toggleMagicCard('digest')">
          <span class="magic-card-title">Weekly Digest</span>
          <span class="magic-card-toggle" id="digest-toggle">+</span>
        </div>
        <div id="digest-body" class="magic-card-body hidden">
          <div id="magic-digest-content" class="digest-content"></div>
        </div>
      </div>

      <!-- Monthly Report -->
      <div id="magic-monthly" class="magic-card hidden">
        <div class="magic-card-header" onclick="toggleMagicCard('monthly')">
          <span class="magic-card-title">Monthly Report</span>
          <span class="magic-card-toggle" id="monthly-toggle">+</span>
        </div>
        <div id="monthly-body" class="magic-card-body hidden">
          <div id="magic-monthly-content" class="digest-content"></div>
        </div>
      </div>

      <!-- Ask Pulse -->
      <div class="magic-card">
        <div class="magic-card-header">
          <span class="magic-card-title">Ask Pulse</span>
        </div>
        <div class="magic-card-body">
          <div id="magic-presets" class="magic-presets"></div>
          <div class="magic-input-row">
            <input type="text" id="ask-input" class="magic-input" placeholder="Ask about your finances..." maxlength="500">
            <button class="btn-primary" onclick="submitAsk()">Ask</button>
          </div>
          <div id="ask-result" class="magic-result hidden"></div>
        </div>
      </div>

      <!-- What-If -->
      <div class="magic-card">
        <div class="magic-card-header">
          <span class="magic-card-title">What-If</span>
        </div>
        <div class="magic-card-body">
          <div class="magic-input-row">
            <input type="text" id="whatif-input" class="magic-input" placeholder="What if we..." maxlength="500">
            <button class="btn-primary" onclick="submitWhatIf()">Forecast</button>
          </div>
          <div id="whatif-result" class="magic-result hidden"></div>
        </div>
      </div>

      <div id="magic-disclaimer" class="magic-disclaimer hidden"></div>
    </section>

    <!-- Transaction Browser -->
    <section id="transactions-section">
      <h2 class="section-heading">Transactions</h2>

      <!-- Filter bar -->
      <div id="filter-bar" class="filter-bar">
        <select id="filter-account"><option value="">All Accounts</option></select>
        <select id="filter-category"><option value="">All Categories</option><option value="0">Uncategorized</option></select>
        <input type="date" id="filter-from">
        <input type="date" id="filter-to">
        <input type="text" id="filter-search" placeholder="Search merchant...">
        <label class="toggle-label">
          <input type="checkbox" id="filter-transfers"> Show transfers
        </label>
      </div>

      <!-- Bulk action bar -->
      <div id="bulk-bar" class="bulk-bar hidden">
        <span id="bulk-count">0 selected</span>
        <button class="btn-primary" onclick="bulkAssignCategory()">Assign Category</button>
        <button class="btn-ghost" onclick="clearSelection()">Clear</button>
      </div>

      <!-- Stats row -->
      <div id="tx-stats" class="tx-stats"></div>

      <!-- Transaction list -->
      <div id="tx-list" class="tx-list"></div>

      <!-- Pagination -->
      <div id="pagination" class="pagination hidden">
        <button id="prev-btn" class="btn-ghost" onclick="prevPage()" disabled>Previous</button>
        <span id="page-info"></span>
        <button id="next-btn" class="btn-ghost" onclick="nextPage()">Next</button>
      </div>
    </section>

  </div>

  <script src="nav.js"></script>
  <script src="app.js"></script>
</body>
</html>
