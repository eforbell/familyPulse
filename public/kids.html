<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#141310">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | My Money</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <script src="privacy.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="sovereign-chassis.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="pulse-skin.css">
</head>
<body data-nav-page="kid-dashboard" data-nav-role="kid">

  <!-- Category assignment overlay (no create-rule for kids) -->
  <div id="category-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="kid-cat-overlay-title">
    <div class="overlay-box">
      <div class="modal-head">
        <div><h2 id="kid-cat-overlay-title">Assign category</h2></div>
        <button type="button" class="modal-close" aria-label="Close" onclick="closeCategoryOverlay()">×</button>
      </div>
      <div class="modal-body">
        <div id="category-list" class="cat-list"></div>
      </div>
    </div>
  </div>

  <div id="kid-tx-detail-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="kid-tx-detail-title">
    <div class="overlay-box wide">
      <div class="modal-head">
        <div>
          <h2 id="kid-tx-detail-title">Transaction Detail</h2>
          <p id="kid-tx-detail-meta" class="modal-sub">Loading…</p>
        </div>
        <button type="button" class="modal-close" aria-label="Close" onclick="closeTransactionDetail()">×</button>
      </div>

      <div class="modal-body">
        <div class="modal-summary">
          <div class="modal-summary-row">
            <span class="k">Display name</span>
            <span class="v" id="kid-tx-detail-display-name">—</span>
          </div>
          <div class="modal-summary-row">
            <span class="k">Amount</span>
            <strong class="v" id="kid-tx-detail-amount">—</strong>
          </div>
          <div class="modal-summary-row">
            <span class="k">Category</span>
            <span class="v" id="kid-tx-detail-category">—</span>
          </div>
          <div class="modal-summary-row">
            <span class="k">Raw synced text</span>
            <span class="v mono" id="kid-tx-detail-raw">—</span>
          </div>
        </div>

        <div class="form-actions">
          <button id="kid-tx-detail-category-btn" class="btn-ghost" type="button" onclick="openCurrentCategoryEditor()">Assign Category</button>
        </div>

        <section class="tx-detail-section">
          <div class="tx-detail-section-head">
            <h3>Note</h3>
            <span id="kid-tx-note-meta" class="tx-detail-subtle"></span>
          </div>
          <div id="kid-tx-note-readonly" class="tx-note-readonly hidden"></div>
          <div id="kid-tx-note-empty" class="tx-detail-subtle">No note yet.</div>
        </section>

        <section class="tx-detail-section">
          <div class="tx-detail-section-head">
            <h3>Attachments</h3>
            <span class="tx-detail-subtle">Receipts, invoices, or photos</span>
          </div>
          <div id="kid-tx-attachment-list" class="tx-attachment-list"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <h1 id="greeting">My Money</h1>
      <button id="who-btn" class="who-btn" title="Sign out" aria-label="Sign out"></button>
    </header>

    <!-- Balance card -->
    <div id="balance-card" class="net-position-card">
      <div class="net-label">My Balance</div>
      <div id="balance-amount" class="net-amount loading-pulse">—</div>
      <div class="rule"></div>
      <div id="balance-detail" class="balance-breakdown-grid"></div>
    </div>

    <!-- Budget progress -->
    <div id="budget-section" class="hidden">
      <h2 class="section-heading">Monthly Budget</h2>
      <div id="budget-card" class="kid-budget-card"></div>
    </div>

    <!-- Category breakdown -->
    <div id="categories-section" class="hidden">
      <h2 class="section-heading">Spending by Category</h2>
      <div id="category-chart-wrap" style="max-width:300px;margin:0 auto 1rem">
        <canvas id="category-chart"></canvas>
      </div>
    </div>

    <!-- Report Card -->
    <div id="report-card-section" class="hidden">
      <div class="magic-card">
        <div class="magic-card-header" onclick="toggleReportCard()">
          <span class="magic-card-title">Money Report Card</span>
          <span class="magic-card-toggle" id="report-card-toggle">+</span>
        </div>
        <div id="report-card-body" class="magic-card-body hidden">
          <div id="report-card-content" class="digest-content"></div>
        </div>
      </div>
    </div>

    <!-- Recent transactions -->
    <section id="transactions-section">
      <h2 class="section-heading">Recent Transactions</h2>
      <div id="tx-list" class="tx-list"></div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="nav.js"></script>
  <script src="kids.js"></script>
</body>
</html>
