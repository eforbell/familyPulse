<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF8F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#141310">
  <meta name="apple-mobile-web-app-title" content="Family Pulse">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Family Pulse | Reports</title>
  <link rel="icon" type="image/png" href="icon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="sovereign-fonts.css">
  <script src="theme.js?v=20260516c"></script>
  <script src="privacy.js?v=20260516c"></script>
  <link rel="stylesheet" href="style.css?v=20260516c">
  <link rel="stylesheet" href="sovereign-chassis.css?v=20260516c">
  <link rel="stylesheet" href="tokens.css?v=20260516c">
  <link rel="stylesheet" href="pulse-skin.css?v=20261004a">
</head>
<body data-nav-page="reports">

  <div id="app">
    <header class="app-header">
      <h1>Reports</h1>
      <div></div>
    </header>

    <!-- Non-parent fallback -->
    <div id="reports-locked" class="empty-state hidden" style="padding:4rem 1rem">
      <div style="font-size:2rem;margin-bottom:0.75rem">Coming Soon</div>
      <p style="color:var(--muted);font-size:0.9rem">Reports and AI analysis will be available here.</p>
    </div>

    <!-- Parent content -->
    <div id="reports-content" class="hidden">

      <!-- Spending burn -->
      <section>
        <h2 class="section-heading">Spending pace</h2>
        <div id="spending-burn"></div>
      </section>

      <!-- Cash flow Sankey (desktop only — needs the horizontal room) -->
      <section id="cash-flow-section" class="sankey-section desktop-only">
        <h2 class="section-heading">Cash flow</h2>
        <div id="cash-flow-sankey" class="chart-card sankey-card"></div>
      </section>

      <!-- Income vs Spending Chart -->
      <section>
        <h2 class="section-heading">Income vs Spending</h2>
        <div class="chart-card">
          <canvas id="income-spending-chart"></canvas>
        </div>
      </section>

      <!-- Spending by Category Chart -->
      <section>
        <h2 class="section-heading">
          Spending by Category
          <select id="doughnut-month-select" class="chart-month-select"></select>
        </h2>
        <div id="doughnut-container" class="chart-card" style="max-width:400px;margin:0 auto">
          <canvas id="category-doughnut-chart"></canvas>
        </div>
      </section>

      <!-- Category Trends Chart -->
      <section>
        <h2 class="section-heading">Category Trends</h2>
        <div class="chart-card">
          <canvas id="category-trends-chart"></canvas>
        </div>
      </section>

      <!-- Ask Pulse -->
      <section style="margin-top:1.5rem">
        <h2 class="section-heading">Ask Pulse</h2>
        <div id="report-presets" class="magic-presets"></div>
        <div class="magic-input-row">
          <input type="text" id="report-ask-input" class="magic-input" placeholder="Ask about your finances..." maxlength="500">
          <button class="btn-primary" onclick="submitReportAsk()">Ask</button>
        </div>
        <div id="report-ask-result" class="magic-result hidden"></div>
      </section>

      <!-- What-If -->
      <section style="margin-top:1.5rem">
        <h2 class="section-heading">What-If Forecasting</h2>
        <div class="magic-input-row">
          <input type="text" id="report-whatif-input" class="magic-input" placeholder="What if we..." maxlength="500">
          <button class="btn-primary" onclick="submitReportWhatIf()">Forecast</button>
        </div>
        <div id="report-whatif-result" class="magic-result hidden"></div>
      </section>

      <section style="margin-top:1.5rem">
        <h2 class="section-heading">Ask & Forecast History</h2>
        <div id="query-history-list" class="reports-list">
          <div class="empty-state loading-pulse">Loading...</div>
        </div>
      </section>

      <div id="report-disclaimer" class="magic-disclaimer hidden"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <script src="nav.js?v=20260516c"></script>
  <script src="spending-burn.js?v=20261004b"></script>
  <script src="cash-flow-sankey.js?v=20261004b"></script>
  <script src="reports.js?v=20261004b"></script>
</body>
</html>
